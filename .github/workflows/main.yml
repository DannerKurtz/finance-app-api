name: Deploy

on:
  push:
    branches: ['main']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Eslint
        run: npm run eslint:check
      - name: Prettier Check
        run: npm run prettier:check
      - name: Tests
        run: npm run test

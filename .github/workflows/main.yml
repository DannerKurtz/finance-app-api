name: Deploy

on:
  push:
    branches: ['main']

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create .env.test file
        run: echo "DATABASE_URL=postgresql://root:password@localhost:5433/finance-app?schema=public" >> .env.test
      - name: Install dependencies
        run: npm install
      - name: Eslint
        run: npm run eslint:check
      - name: Prettier Check
        run: npm run prettier:check
      - name: Tests
        run: npm run test

  deploy:
    runs-on: ubuntu-latest
    needs: check
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm install
      - name: Create .env file
        uses: skiddph/actions-env@v1.0.3
        with:
          file: .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Prisma Migrate
        run: npx prisma migrate deploy
